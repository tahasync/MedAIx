name: App Build Debug

on:
  workflow_dispatch:
    inputs:
      sprint:
        description: Sprint number for the debug build
        type: number
        default: 5
        required: true
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-build-sprint.yml'

concurrency:
  group: app-build-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || '3.44.9' }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=MEDAIX_SPRINT=${{ inputs.sprint || 5 }}

      - name: Verify APK exists
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          echo "APK built successfully at $APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-sprint${{ inputs.sprint || 5 }}.apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
