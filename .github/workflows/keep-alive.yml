name: Keep Alive

# Pings the API's own /health route every 10 minutes so Render's free instance
# never crosses its ~15-minute idle threshold. No path filter — this runs on a
# schedule, not on commits. Pair with an external monitor (UptimeRobot /
# cron-job.org) since GitHub can delay scheduled runs under load.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl /health
        env:
          HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "API_HEALTH_URL repository variable is not set — nothing to ping."
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsSL --max-time 30 "$HEALTH_URL"; then
              echo "Pinged $HEALTH_URL successfully."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10s."
            sleep 10
          done
          echo "Ping failed after 3 attempts."
          exit 1