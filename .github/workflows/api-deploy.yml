name: API Deploy

on:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-deploy.yml'

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest -v

      - name: Deploy to Render (free tier)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Fails the job on purpose. This step used to `exit 0` when the secret
          # was absent, which made every push report success while deploying
          # nothing — the single reason main stayed green for weeks without ever
          # reaching Render. A red run here means "no deploy happened", which is
          # the truth; a green one now guarantees the hook actually fired.
          #
          # Fix: Render dashboard -> medaix-api -> Settings -> Deploys ->
          # "Deploy hook" (or the blue status-badge URL), then add it as the
          # repository secret RENDER_DEPLOY_HOOK_URL.
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set, so nothing was deployed."
            echo "::error::Add the Render deploy hook as a repository secret to fix this."
            exit 1
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy hook triggered."