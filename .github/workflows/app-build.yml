name: App Build

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-build.yml'
  workflow_dispatch:

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve signing availability
        # Secrets are not exposed to `if:` expressions, so probe through env.
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail fast when release signing is required
        # Guards the main branch: shipping a debug-signed artifact to users
        # under the MedAIx name is worse than failing the build.
        if: >-
          steps.signing.outputs.available != 'true'
          && (github.ref == 'refs/heads/main' || github.event_name == 'release')
        run: |
          echo "::error::Release signing secrets are not configured. Set"
          echo "::error::ANDROID_SIGNING_KEY, ANDROID_KEYSTORE_PASSWORD,"
          echo "::error::ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
          exit 1

      - name: Decode signing keystore
        # Keystore lands in android/app/ because storeFile is resolved relative
        # to the Gradle module directory, not android/ (rootProject).
        if: steps.signing.outputs.available == 'true'
        working-directory: ./app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Resolve build version
        # Single source of truth is pubspec.yaml. Deriving the artifact name
        # here keeps the upload, the verify step and the release in agreement,
        # so a version bump can't leave a stale "medaix-release-apk" behind.
        id: version
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          # pubspec `name` is the Dart package (tahasync_medaix), not the brand,
          # so the artifact name is built from the product name only.
          # 0.1.0+1 -> v0.1.0-1; '+' is legal in filenames but reads badly.
          SLUG=$(printf 'v%s' "$VERSION" | tr '+' '-')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "slug=MedAIx-$SLUG-release" >> "$GITHUB_OUTPUT"
          echo "Building MedAIx v$VERSION"

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK identity and signing state
        run: |
          # This job defaults to working-directory ./app, so the artifact is
          # relative to app/. `uses:` steps ignore that default, hence their
          # paths stay repo-root relative.
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }

          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT" dump packagename "$APK" | tee package.txt
          grep -qx 'com.tahasync.medaix' package.txt

          # Prefer the apksigner on PATH, else scan build-tools directly:
          # the newest build-tools dir can be a preview channel without one.
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            for dir in "$ANDROID_HOME"/build-tools/*/; do
              if [ -x "${dir}apksigner" ]; then APKSIGNER="${dir}apksigner"; fi
            done
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found; cannot verify release signing"
            exit 1
          fi

          # Print the certs so a future signing failure is diagnosable from
          # the log instead of a bare non-zero exit.
          if ! "$APKSIGNER" verify --print-certs "$APK"; then
            echo "::error::apksigner could not verify $APK"
            exit 1
          fi
          # Fails if the APK fell back to debug signing.
          "$APKSIGNER" verify --print-certs "$APK" | grep -q 'certificate DN'

          # Ship a properly named file rather than a bare app-release.apk.
          mv "$APK" "${{ steps.version.outputs.slug }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.slug }}.apk
          path: app/${{ steps.version.outputs.slug }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up signing material
        # Never leave key material in the workspace after the build.
        if: always()
        run: rm -f android/key.properties android/app/keystore.jks