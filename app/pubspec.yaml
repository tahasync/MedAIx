name: tahasync_medaix
description: "MedAIx — AI-powered clinical decision support."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Fake clock for the ApiClient deadline test, so it exercises the timeout
  # without a real sleep. Transitive via flutter_test, declared for direct use.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/wordmark.png
