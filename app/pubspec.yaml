name: tahasync_medaix
description: "MedAIx — AI-powered clinical decision support."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  supabase_flutter: ^2.9.0
  # File selection and camera capture for Sprint 1 OCR.
  # Pinned to >=13 because 8.x's Android module compiles against API 34 and
  # pulls a plugin lifecycle dependency that requires 36, failing the build.
  file_picker: ^13.1.0
  image_picker: ^1.2.0
  # In-app "Update Available" dialog: installed version/build for the
  # comparison, and opening the GitHub release APK in the browser.
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  go_router: ^18.1.1
  shared_preferences: ^2.5.6
  fl_chart: ^1.3.0
  connectivity_plus: ^7.3.2
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl: ^0.20.2
  # Fake clock for the ApiClient deadline test, so it exercises the timeout
  # without a real sleep. Transitive via flutter_test, declared for direct use.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  # All three are generated by tool/generate_icons.py. logo.png is the complete
  # lockup (tile + wordmark + tagline) used by the splash and sign-in screens.
  assets:
    - assets/logo.png
    - assets/logo-dark.png
    - assets/wordmark.png
    - assets/mark.png
    - assets/mark-dark.png
    - assets/brand/

  # Design system type pairing (docs/design-system.md §4): Figtree for
  # headings and labels, Noto Sans for body. Bundled (OFL, licences alongside)
  # rather than fetched at runtime so first launch and offline use look right.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
