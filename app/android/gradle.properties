org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation fails on Windows with
# "Could not close incremental caches ... .tab" — the compiler cannot release
# the cache files because something still holds a handle on them. It is a
# file-locking problem, not a code problem, and it makes the Android build
# fail at :<plugin>:compileDebugKotlin rather than anything to do with the
# plugin's source. Disabling incremental Kotlin compilation sidesteps it; the
# cost is a slower local Android build.
kotlin.incremental=false
