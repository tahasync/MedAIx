[project]
name = "medaix-api"
version = "0.1.0"
description = "MedAIx API — clinical decision-support backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "psycopg[binary]>=3.2.0",
    # database.py imports dotenv directly, so it must be a direct dependency.
    # It is only reachable today as a transitive extra of uvicorn[standard],
    # which makes a `uv sync --frozen` deploy one uvicorn release away from an
    # ImportError at startup.
    "python-dotenv>=1.0.1",
    # Sprint 1 — report upload + OCR.
    # pytesseract is only a wrapper; it shells out to the Tesseract binary,
    # which must be installed separately (winget UB-Mannheim.TesseractOCR).
    "pytesseract>=0.3.13",
    # Pillow handles decode/resize/grayscale/contrast. opencv-python is
    # deliberately NOT used: deskew is a projection-profile calculation that
    # numpy covers, and cv2 adds ~60 MB to every cold start on Render's free
    # tier for no benefit here.
    "pillow>=11.0.0",
    "numpy>=2.1.0",
    # PDF reports: render page 1 to an image, then run the same image path.
    "pypdf>=5.1.0",
    "python-multipart>=0.0.20",
    # Verifies Supabase access tokens (ES256) against the project JWKS.
    "pyjwt[crypto]>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette 1.7 nudges toward httpx2; we stay on httpx until the API
    # actually needs HTTP/2 or async client features. Revisit before Sprint 12.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
