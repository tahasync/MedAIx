<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedAIx</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Figtree,system-ui,sans-serif;background:#07060b;color:#eae8f0;min-height:100vh;display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:center;padding:64px 20px 20px}
.ph{width:390px;height:810px;border-radius:46px;border:8px solid #1b1a24;overflow:hidden;position:relative;background:var(--bg);color:var(--tx);isolation:isolate}
.ph[data-t=d]{--bg:#0e0d15;--s1:#141a2a;--s2:#202d4e;--pr:#7c83ad;--tx:#eeeaf2;--mu:#a9aec8;--gl:#141a2a;--gb:#2d3b61;--ok:#5fb89a;--wn:#e0b15c;--er:#e5768a;--on:#0e0d15}
.ph[data-t=l]{--bg:#f7f4f2;--s1:#fff;--s2:#e6e8f2;--pr:#182346;--tx:#0e0d15;--mu:#4d5575;--gl:#ffffff;--gb:#dcdde8;--ok:#1f7a5c;--wn:#8a5a00;--er:#b3283f;--on:#fff}
.sb{position:absolute;top:0;left:0;right:0;height:40px;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:13px;font-weight:600;z-index:3}
#scr,.sc{height:100%;overflow-y:auto;padding:48px 18px 110px;scrollbar-width:none}#scr::-webkit-scrollbar{display:none}
.nav{position:absolute;left:14px;right:14px;bottom:14px;height:64px;border-radius:32px;display:flex;justify-content:space-around;align-items:center;padding:0 6px;z-index:4;background:var(--s2);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.nav button{width:56px;height:52px;border-radius:26px;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 11px Figtree,sans-serif;cursor:pointer}
.nav button.on{background:var(--pr);color:var(--on)}
h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.4px}h2{font-size:19px;font-weight:650;line-height:1.25}h3{font-size:16px;font-weight:600;margin:20px 0 10px}
p{font-size:15px;line-height:1.45}.mu{color:var(--mu)}.sm{font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.card{background:var(--gl);border-radius:24px;padding:18px;margin-bottom:12px}
.ai{background:var(--s2)}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:24px;border:0;background:var(--pr);color:var(--on);font:600 16px Figtree,sans-serif;cursor:pointer;margin-top:12px}
.btn.g{background:var(--s2);color:var(--tx)}.btn.s{width:auto;display:inline-flex;padding:0 20px;min-height:44px}
.ib{width:48px;height:48px;border-radius:24px;background:var(--gl);color:var(--tx);border:0;display:grid;place-items:center;cursor:pointer}
button:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{min-height:92px;border-radius:22px;border:0;background:var(--gl);color:var(--tx);padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font:600 15px Figtree,sans-serif;cursor:pointer}
.row{display:flex;align-items:center;gap:12px}.row>.g1{flex:1}
.ch{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:17px;border:0;background:var(--s2);color:var(--tx);font:500 13px Figtree,sans-serif;cursor:pointer}
.ch.on{background:var(--pr);color:var(--on);border-color:transparent}
.st{display:inline-flex;gap:5px;align-items:center;font-size:13px;font-weight:600}.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--gb)}.li:last-child{border:0}
.ico{width:40px;height:40px;border-radius:14px;background:var(--s2);display:grid;place-items:center;flex:none}
.bar{height:8px;border-radius:4px;background:var(--s2);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:26px 8px}.empty .ico{margin:0 auto 12px;width:64px;height:64px;border-radius:22px}.empty p{margin:6px 0 4px}
.ban{display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:16px;background:color-mix(in srgb,var(--wn) 18%,transparent);color:var(--tx);font-size:13px;margin-bottom:12px}
.tg{width:52px;height:30px;border-radius:15px;border:0;background:var(--s2);position:relative;cursor:pointer;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--tx);transition:.2s}.tg[aria-checked=true]{background:var(--pr)}.tg[aria-checked=true]::after{left:25px;background:var(--on)}
.view{height:300px;border-radius:26px;background:#05050a;position:relative;display:grid;place-items:center;margin-bottom:12px;overflow:hidden;color:#fff}.view i{position:absolute;inset:50px 44px;border:2px solid #bfa9ba;border-radius:22px}.view i::after{content:"";position:absolute;left:8px;right:8px;top:0;height:2px;background:#bfa9ba;animation:sc 2s infinite alternate}@keyframes sc{to{top:100%}}
#toast{position:absolute;left:24px;right:24px;bottom:92px;z-index:5;padding:12px 16px;border-radius:18px;background:var(--tx);color:var(--bg);font-size:14px;font-weight:600;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}#toast.on{opacity:1;transform:none}
.tv{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;min-height:40px;padding:0 20px;border-radius:20px;border:0;background:#202d4e;color:#fff;font:600 14px Figtree,sans-serif;cursor:pointer}.bd{display:none;flex-wrap:wrap;gap:28px 22px;justify-content:center;align-items:flex-start;width:100%;max-width:1500px}.fw{cursor:pointer;border-radius:30px}.fw:focus-visible{outline:2px solid #bfa9ba;outline-offset:6px}.bw{width:242px;height:502px;border-radius:30px;overflow:hidden}.bw .ph{transform:scale(.62);transform-origin:0 0;pointer-events:none}.fl{font-size:13px;margin-top:8px;text-align:center;color:#c9cce0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:500px){body{padding:0;display:block}.tv{top:6px}#ph{width:100%;height:100dvh;border:0;border-radius:0}}
</style></head><body>
<button class="tv" id="tv" data-a="view"></button><div class="ph" data-t="d" id="ph"><div class="sb"><span>9:41</span></div><main id="scr"></main><div class="nav" id="nav" role="navigation" aria-label="Main"></div><div id="toast" role="status"></div></div><div class="bd" id="bd"></div>
<script>
const P={home:"M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",file:"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5 M9 13h6 M9 17h6",pill:"M10.5 20.5a5 5 0 0 1-7-7l10-10a5 5 0 0 1 7 7z M8.5 8.5l7 7",heart:"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z",more:"M4 6h16 M4 12h16 M4 18h16",cam:"M21 19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h4l2 3h3a2 2 0 0 1 2 2z M12 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8z",qr:"M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h3v3h-3z M20 14v7 M14 20h3",sh:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",ck:"M20 6L9 17l-5-5",al:"M12 9v4 M12 17h.01 M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",dr:"M6 3v6a4 4 0 0 0 8 0V3 M10 13v2a5 5 0 0 0 10 0v-2 M20 9a2 2 0 1 0 0 4 2 2 0 0 0 0-4z",sp:"M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z",pl:"M12 5v14 M5 12h14",ch:"M9 6l6 6-6 6",up:"M12 16V4 M7 9l5-5 5 5 M4 20h16",bell:"M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9 M10 21h4",wd:"M12 2.7s6 6.2 6 10.3a6 6 0 0 1-12 0c0-4.1 6-10.3 6-10.3z",ac:"M22 12h-4l-3 9L9 3l-3 9H2",tr:"M3 17l6-6 4 4 8-8 M15 7h6v6",x:"M18 6L6 18 M6 6l12 12",us:"M20 21a8 8 0 0 0-16 0 M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const S={s:'onboard',v:'b',tgl:{m:1,w:1,f:0},dark:1,ld:0,meds:[],chk:0,perm:0,scan:0,spec:'',water:3,qr:0,off:!navigator.onLine};
const MEDS=['Metformin 500 mg','Ibuprofen 400 mg','Warfarin 5 mg'];
const spark=(pts)=>`<svg viewBox="0 0 300 90" width="100%" role="img" aria-label="HbA1c rose from 5.9 to 6.4 over four reports"><polyline fill="none" stroke="var(--pr)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/><line x1="0" y1="30" x2="300" y2="30" stroke="var(--wn)" stroke-dasharray="4 5"/>${pts.split(' ').map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="5" fill="var(--pr)"/>`).join('')}</svg>`;
const hd=(t,sub,ic2)=>`<div class="hd"><div><h1>${t}</h1>${sub?`<p class="mu sm">${sub}</p>`:''}</div>${ic2||''}</div>`;
const qrSvg=()=>{let r=7,o='';const f=(x,y)=>(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);for(let y=0;y<21;y++)for(let x=0;x<21;x++){let on;if(f(x,y)){const a=x>13?x-14:x,b=y>13?y-14:y;on=a==0||a==6||b==0||b==6||(a>=2&&a<=4&&b>=2&&b<=4)}else{r=(r*1103515245+12345)&0x7fffffff;on=r%100<48}if(on)o+=`<rect x="${x*8}" y="${y*8}" width="8" height="8"/>`}return`<svg viewBox="0 0 168 168" width="200" height="200" fill="#0e0d15" role="img" aria-label="QR code, valid for one doctor visit" style="background:#fff;padding:12px;border-radius:20px;display:block;margin:0 auto">${o}</svg>`};
const scr={
onboard:()=>`${hd('Let’s set up your profile','Step 2 of 4 · 2 minutes')}<div class="bar" role="progressbar" aria-valuenow="50"><i style="width:50%"></i></div><h3>Any conditions we should know about?</h3><div class="row" style="flex-wrap:wrap;gap:8px"><button class="ch on">${ic('ck',14)} Diabetes</button><button class="ch">Hypertension</button><button class="ch">Asthma</button><button class="ch">Thyroid</button><button class="ch">None</button></div><h3>Allergies</h3><div class="row" style="flex-wrap:wrap;gap:8px"><button class="ch">Penicillin</button><button class="ch on">${ic('ck',14)} Peanuts</button><button class="ch">${ic('pl',14)} Add</button></div><p class="mu sm" style="margin-top:16px">Camera and notification access are only requested when you first need them.</p><button class="btn" data-go="upload">Continue to first report</button><button class="btn g" data-go="home">Skip for now</button>`,
home:()=>`${hd('Muhammad','Good evening',`<button class="ib" data-go="settings" aria-label="Reminders">${ic('bell')}</button>`)}<section class="card ai"><p class="tag">${ic('sp',16)} AI insight</p><h2>Your HbA1c has risen across 3 reports</h2><p class="mu" style="margin-top:6px">5.9 in March to 6.4 now. Worth raising with your doctor.</p><button class="btn s" data-go="trends">See the trend</button></section><div class="grid"><button class="tile" data-go="upload">${ic('up',22)}Upload report</button><button class="tile" data-go="meds">${ic('pill',22)}Check medicines</button><button class="tile" data-go="scan">${ic('cam',22)}Scan medicine</button><button class="tile" data-go="doctor">${ic('dr',22)}Find a doctor</button></div><div class="card row"><svg width="64" height="64" viewBox="0 0 36 36" role="img" aria-label="Habit score 72 of 100"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--s2)" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="var(--pr)" stroke-width="4" stroke-linecap="round" stroke-dasharray="68 100" transform="rotate(-90 18 18)" pathLength="100"/></svg><div class="g1"><h2>Habit score 72</h2><p class="mu sm">Log water to reach 80 today</p></div><button class="ib" data-go="wellness" aria-label="Open wellness">${ic('ch')}</button></div><h3>Latest report</h3><button class="card row" style="width:100%;text-align:left;color:inherit;cursor:pointer" data-go="report"><span class="ico">${ic('file')}</span><div class="g1"><b>Blood test, 18 Oct</b><p class="mu sm">2 values need attention</p></div>${ic('ch')}</button>`,
upload:()=>S.ld?`${hd('Reading your report','Step 2 of 3 · extracting values')}<div class="card"><div class="bar" role="progressbar" aria-valuenow="62"><i style="width:62%"></i></div></div><div class="sk" style="height:88px;margin-bottom:12px"></div><div class="sk" style="height:56px;margin-bottom:10px"></div><div class="sk" style="height:56px;margin-bottom:10px"></div><div class="sk" style="height:56px"></div>`:`${hd('Upload report')}<div class="card empty"><span class="ico">${ic('file',28)}</span><h2>No reports yet</h2><p class="mu">Add a lab report and we’ll explain every value in plain language.</p><button class="btn" data-a="up">${ic('cam')} Scan a report</button><button class="btn g" data-a="up">${ic('up')} Choose from gallery or files</button></div><p class="sm mu" style="text-align:center">Works offline. Reports sync when you reconnect.</p>`,
uerr:()=>`${hd('Upload report')}<div class="card"><p class="tag er">${ic('al',16)} Couldn’t read this photo</p><p>The image was too blurry to find any values. Nothing was saved, and your existing reports are safe.</p><button class="btn" data-go="upload">Try again</button><button class="btn g" data-go="upload">Choose another file</button></div>`,
profile:()=>`${hd('Profile','Used to tailor goals and alerts')}<div class="card">${[['Age','28'],['Sex','Male'],['Height','172 cm'],['Weight','68 kg'],['Conditions','Diabetes'],['Allergies','Peanuts'],['Medicines','3']].map(x=>`<div class="li"><span class="g1">${x[0]}</span><span class="mu">${x[1]}</span></div>`).join('')}</div><button class="btn">Edit details</button>`,
reminders:()=>{const t=(k,l,s)=>`<div class="li"><div class="g1"><b>${l}</b><p class="mu sm">${s}</p></div><button class="tg" role="switch" aria-checked="${S.tgl[k]?'true':'false'}" aria-label="${l}" data-a="tgl" data-v="${k}"></button></div>`;return `${hd('Reminders','Delivered on this device')}<div class="card">${t('m','Take medicines','Every day at 8:00 am')}${t('w','Drink water','Every 2 hours, 9 am to 9 pm')}${t('f','Doctor follow-up','3 days before your visit')}</div>`},
reports:()=>`${hd('Reports','3 reports')}<div class="card">${[['Blood test','18 Oct 2026','2 need attention','wn','al'],['Lipid profile','12 Aug 2026','All normal','ok','ck'],['Blood test','2 Jun 2026','All normal','ok','ck']].map(x=>`<div class="li" data-go="report" style="cursor:pointer"><span class="ico">${ic('file')}</span><div class="g1"><b>${x[0]}</b><p class="mu sm">${x[1]}</p></div><span class="st ${x[3]}">${ic(x[4],15)} ${x[2]}</span></div>`).join('')}</div><button class="btn" data-go="upload">${ic('up')} Upload report</button>`,
report:()=>`${hd('Blood test','18 Oct 2026 · Lab report')}<div class="card"><p class="tag">${ic('sp',16)} In plain words</p><p>Your blood sugar average is slightly high. Cholesterol and kidney values look normal.</p></div>${[['HbA1c','6.4 %','High','wn','al','Average blood sugar over 3 months. Above 6.0 is prediabetic range.'],['Fasting glucose','118 mg/dL','Slightly high','wn','al','Sugar after fasting. Normal is under 100.'],['Creatinine','0.9 mg/dL','Normal','ok','ck','Shows how well your kidneys filter.'],['LDL cholesterol','92 mg/dL','Normal','ok','ck','The “bad” cholesterol. Lower is better.']].map(r=>`<div class="card"><div class="row"><b class="g1">${r[0]}</b><span class="st ${r[3]}">${ic(r[4],15)} ${r[2]}</span></div><h2 style="margin:4px 0">${r[1]}</h2><p class="mu sm">${r[5]}</p></div>`).join('')}<button class="btn" data-go="trends">View trend over time</button>`,
trends:()=>`${hd('HbA1c trend','4 reports · Mar to Oct')}<div class="card">${spark('10,70 100,58 200,42 290,26')}<div class="row sm mu" style="justify-content:space-between"><span>Mar 5.9</span><span>Jun 6.1</span><span>Aug 6.2</span><span>Oct 6.4</span></div></div><div class="card"><p class="tag wn">${ic('al',16)} Rising 3 times in a row</p><p>This isn’t a diagnosis. A doctor can confirm with more tests.</p><button class="btn" data-go="doctor">Find a specialist</button></div>`,
meds:()=>{const w=S.chk;return `${hd('Medicine check','Find risky combinations')}${S.meds.length?`<div class="card">${S.meds.map(m=>`<div class="li"><span class="ico">${ic('pill')}</span><b class="g1">${m}</b></div>`).join('')}</div>`:`<div class="card empty"><span class="ico">${ic('pill',28)}</span><h2>No medicines added</h2><p class="mu">Add what you take. We’ll flag combinations that can cause harm.</p></div>`}<button class="btn g" data-a="addmed" ${S.meds.length>=3?'disabled style="opacity:.5"':''}>${ic('pl')} ${S.meds.length?'Add another medicine':'Add first medicine'}</button>${S.meds.length>1?`<button class="btn" data-a="chk">Check interactions</button>`:''}${w?`<div class="card" style="margin-top:12px"><p class="tag er">${ic('al',16)} Ibuprofen with warfarin</p><p>Together they raise the risk of serious bleeding. Don’t take both unless your doctor agrees.</p><button class="btn g" data-go="doctor">Ask a doctor</button></div>`:''}`},
scan:()=>!S.perm?`${hd('Scan medicine')}<div class="card"><span class="ico">${ic('cam')}</span><h2 style="margin-top:10px">Camera access needed</h2><p class="mu">We use the camera only to read the name on the packet. Photos aren’t stored.</p><button class="btn" data-a="perm">Allow camera</button><button class="btn g" data-go="meds">Type the name instead</button></div>`:`${hd('Scan medicine','Point at the packet')}<div class="view">${S.scan?`<div style="text-align:center">${ic('ck',44)}<p>Panadol 500 mg</p></div>`:'<i></i><span class="sm">Hold steady…</span>'}</div>${S.scan?`<div class="card"><p class="tag ok">${ic('ck',16)} Matches your list</p><p class="mu">Paracetamol 500 mg. Safe with your current medicines.</p><button class="btn" data-go="meds">Add to my medicines</button></div>`:`<button class="btn" data-a="scan">Capture packet</button>`}`,
doctor:()=>`${hd('Find a doctor','What’s bothering you?')}<div class="row" style="flex-wrap:wrap;gap:8px">${['Thirst and tiredness','Chest pain','Skin rash','Joint pain'].map(c=>`<button class="ch ${S.spec==c?'on':''}" data-a="spec" data-v="${c}">${c}</button>`).join('')}</div>${S.spec?`<div class="card" style="margin-top:16px"><p class="tag">${ic('dr',16)} Recommended</p><h2>Endocrinologist</h2><p class="mu" style="margin:6px 0">Why: your HbA1c is rising and you mentioned thirst and tiredness. These often point to blood sugar changes.</p><button class="btn" data-go="qr">Share my records</button></div>`:`<div class="card empty"><p class="mu">Pick a symptom to see which specialist fits.</p></div>`}`,
wellness:()=>`${hd('Today','Habit score 72')}<div class="card"><div class="row"><span class="ico">${ic('wd')}</span><div class="g1"><b>Water</b><p class="mu sm">${S.water*250} / 2400 ml</p></div><button class="ib" data-a="water" aria-label="Add 250 ml">${ic('pl')}</button></div><div class="bar" style="margin-top:12px"><i style="width:${S.water*250/24}%"></i></div></div><div class="card"><div class="row"><span class="ico">${ic('ac')}</span><div class="g1"><b>Steps</b><p class="mu sm">4,120 / 6,000 · goal set for your condition</p></div></div><div class="bar" style="margin-top:12px"><i style="width:69%"></i></div></div><div class="card"><div class="row"><span class="ico">${ic('heart')}</span><div class="g1"><b>Exercise</b><p class="mu sm">Not logged yet</p></div><button class="btn s g" style="margin:0">Log walk</button></div></div>`,
qr:()=>`${hd('Share with doctor','Time-limited, read-only')}${S.qr?`<div class="card">${qrSvg()}<p style="text-align:center;margin-top:12px"><b>Expires in <span id="cd">${fmt(S.qr)}</span></b></p><p class="mu sm" style="text-align:center">Your doctor sees reports and medicines only</p><button class="btn g" data-a="rev">Revoke access now</button></div>`:`<div class="card empty"><span class="ico">${ic('qr',28)}</span><h2>No active codes</h2><p class="mu">Create a code your doctor scans to view selected records. You choose how long it lasts.</p></div><div class="row" style="gap:8px">${[15,30,60].map(m=>`<button class="ch on" style="flex:1;justify-content:center;min-height:44px" data-a="gen" data-v="${m}">${m} min</button>`).join('')}</div><button class="btn" data-a="gen" data-v="30">Create code</button>`}`,
docscan:()=>`${hd('Doctor portal','Scanned just now')}<div class="card"><p class="tag ok">${ic('sh',16)} Read-only access · 28:14 left</p><h2>Muhammad</h2><p class="mu sm">Diabetes · Peanut allergy</p></div><div class="card"><b>Shared records</b><div class="li"><span class="ico">${ic('file')}</span><span class="g1">Blood test, 18 Oct</span>${ic('ch')}</div><div class="li"><span class="ico">${ic('pill')}</span><span class="g1">Current medicines (3)</span>${ic('ch')}</div></div><p class="mu sm">This view is logged. The patient can revoke it at any time.</p>`,
settings:()=>{const r=(l,s,g)=>`<div class="li"${g?` data-go="${g}" style="cursor:pointer"`:''}><span class="g1">${l}</span>${s||ic('ch')}</div>`,tg=(a,on)=>`<button class="tg" role="switch" aria-checked="${on}" aria-label="Toggle" data-a="${a}"></button>`;return `${hd('Settings')}${S.off?'':''}<h3>Preferences</h3><div class="card">${r('Reminders',0,'reminders')}${r('Dark appearance',tg('theme',!!S.dark))}</div><h3>Records</h3><div class="card">${r('Share with doctor',0,'qr')}${r('Doctor portal',0,'docscan')}</div><h3>Account</h3><div class="card">${r('Profile and health details',0,'profile')}${r('Export my data')}${r('Sign out')}<div class="li er"><span class="g1">Delete my data</span></div></div><h3>Help and support</h3><div class="card">${r('Frequently asked questions')}${r('Troubleshooting')}${r('Contact support')}</div>`}
};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const NAV=[['home','home','Home'],['reports','file','Reports'],['meds','pill','Meds'],['wellness','heart','Wellness'],['settings','more','More']];
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
const act=(c,k)=>c==k||(k=='reports'&&['upload','uerr','report','trends'].includes(c))||(k=='meds'&&c=='scan')||(k=='settings'&&['profile','reminders','qr','docscan'].includes(c));
const navH=c=>NAV.map(n=>`<button data-go="${n[0]}" class="${act(c,n[0])?'on':''}" aria-label="${n[2]}">${ic(n[1])}<span>${n[2]}</span></button>`).join('');
const ban=()=>S.off?`<div class="ban">${ic('al',16)} You’re offline. Changes are saved and will sync later.</div>`:'';
const BOARD=[['Welcome setup','onboard',{}],['Home','home',{}],['Home, light','home',{dark:0}],['Home, offline','home',{off:1}],['Upload, empty','upload',{}],['Upload, reading','upload',{ld:1}],['Upload, error','uerr',{}],['Reports','reports',{}],['Report','report',{}],['Trend','trends',{}],['Medicines, empty','meds',{}],['Interaction warning','meds',{meds:MEDS.slice(),chk:1}],['Scanner, camera access','scan',{}],['Scanner, matched','scan',{perm:1,scan:1}],['Doctor match','doctor',{}],['Doctor match, result','doctor',{spec:'Thirst and tiredness'}],['Wellness','wellness',{}],['Share, empty','qr',{}],['Share, active','qr',{qr:1680}],['Doctor portal','docscan',{}],['More','settings',{}],['Profile','profile',{}],['Reminders','reminders',{}]];
function frame(id,ov,lab){const sv={...S};Object.assign(S,ov);const h=ban()+scr[id](),dk=S.dark;Object.assign(S,sv);return `<div class="fw" data-go="${id}" role="button" tabindex="0" aria-label="Open ${lab}"><div class="bw"><div class="ph" data-t="${dk?'d':'l'}"><div class="sb"><span>9:41</span></div><div class="sc">${h}</div>${id=='onboard'?'':`<div class="nav">${navH(id)}</div>`}</div></div><p class="fl">${lab}</p></div>`}
function render(){const b=S.v=='b',ph=document.getElementById('ph'),bd=document.getElementById('bd');ph.style.display=b?'none':'';bd.style.display=b?'flex':'none';document.getElementById('tv').textContent=b?'Open app':'All screens';
if(b){bd.innerHTML='<div style="width:100%;text-align:center;margin-bottom:6px"><h1>MedAIx</h1><p style="color:#a9aec8">'+BOARD.length+' screens and states. Tap any screen to open it.</p></div>'+BOARD.map(x=>frame(x[1],x[2],x[0])).join('');return}
ph.dataset.t=S.dark?'d':'l';document.getElementById('scr').innerHTML=ban()+scr[S.s]();const n=document.getElementById('nav');n.style.display=S.s=='onboard'?'none':'flex';n.innerHTML=navH(S.s)}
let T;document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-a]');if(!b)return;if(b.dataset.go){S.v='p';S.s=b.dataset.go;if(S.s=='upload')S.ld=0;render();document.getElementById('scr').scrollTop=0;return}
const a=b.dataset.a,v=b.dataset.v;if(a=='theme')S.dark=!S.dark;else if(a=='view')S.v=S.v=='b'?'p':'b';else if(a=='tgl')S.tgl[v]=!S.tgl[v];else if(a=='up'){S.ld=1;render();setTimeout(()=>{S.ld=0;S.s='report';render();toast('Report ready. 2 values need attention')},1600);return}else if(a=='addmed'){S.meds.push(MEDS[S.meds.length]);S.chk=0;toast('Medicine added')}else if(a=='chk')S.chk=1;else if(a=='perm')S.perm=1;else if(a=='scan'){S.scan=1}else if(a=='spec')S.spec=v;else if(a=='water'){S.water=Math.min(S.water+1,9);toast('Added 250 ml of water')}else if(a=='gen'){S.qr=v*60;clearInterval(T);T=setInterval(()=>{S.qr--;const c=document.getElementById('cd');if(c)c.textContent=fmt(S.qr);if(S.qr<=0){clearInterval(T);S.qr=0;if(S.s=='qr')render()}},1000);toast('Code created for '+v+' minutes')}else if(a=='rev'){S.qr=0;clearInterval(T);toast('Access revoked')}
render()});
addEventListener('online',()=>{S.off=0;render()});addEventListener('offline',()=>{S.off=1;render()});
addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.classList.contains('fw')){e.preventDefault();e.target.click()}});
render();
</script></body></html>
